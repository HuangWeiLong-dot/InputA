name: Deploy frontend (GitHub Pages)

# The SPA is a single document with no client-side router, so a Pages deploy is
# just "publish dist/". The backend is deployed separately (deploy-backend.yml);
# this workflow only needs to know its origin, which is baked in at build time.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  # pages:write publishes the artifact; id-token:write is the OIDC handshake
  # deploy-pages performs instead of using a long-lived token.
  pages: write
  id-token: write

# One Pages deployment at a time, and never cancel one in flight — a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Note this installs better-sqlite3 (a native module) even though the
      # frontend never uses it: `npm run build` runs `tsc -b`, and
      # tsconfig.node.json typechecks server/ too, which imports it. Prebuilt
      # binaries make that a download, not a compile.
      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Validates the configured backend origin **without printing it**.
      #
      # The Variable holds the origin base64-encoded (`API_BASE_URL_ENC`), not in plain
      # text, for two reasons: the value lands in this build and therefore in the public
      # bundle, and — less obviously — a non-secret variable's value is echoed verbatim
      # into this job log, which on a public repository is public too. Encoding it in the
      # Variable is what keeps the address out of both. `DEPLOY.md` has the one-liner that
      # produces the value.
      #
      # The check below exists because the failure mode is otherwise silent: a plain URL
      # pasted in by mistake fails `atob`, `decodeApiBase` falls back to same-origin, and
      # the site quietly ships with no backend at all. Failing the build is much louder.
      - name: Check the backend origin
        env:
          ENCODED_ORIGIN: ${{ vars.API_BASE_URL_ENC }}
        run: |
          if [ -z "$ENCODED_ORIGIN" ]; then
            echo "backend origin: not configured — this build will be same-origin, so it has no backend"
            exit 0
          fi
          decoded="$(printf '%s' "$ENCODED_ORIGIN" | base64 -d 2>/dev/null || true)"
          case "$decoded" in
            https://*)
              echo "backend origin: configured (https)"
              ;;
            '')
              echo "::error::API_BASE_URL_ENC is not valid base64. Encode the origin first: printf '%s' 'https://your-host' | base64 -w0"
              exit 1
              ;;
            http://*)
              echo "::error::API_BASE_URL_ENC decodes to an http:// URL — it must be https, or the Pages page blocks every request as mixed content."
              exit 1
              ;;
            *)
              echo "::error::API_BASE_URL_ENC decodes to something that is not an http(s) URL."
              exit 1
              ;;
          esac

      - name: Build
        env:
          # '/InputA' for a project site, empty for a user/org site — the config
          # normalises it and falls back to '/'.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Already encoded, so it is passed straight through. Never add a plaintext
          # VITE_API_BASE here: Vite inlines whatever the code references, so a plain
          # value would go straight back into the bundle the encoding exists to keep
          # it out of.
          VITE_API_BASE_ENC: ${{ vars.API_BASE_URL_ENC }}
        run: |
          echo "BASE_PATH=${BASE_PATH:-<unset, serving from the domain root>}"
          echo "VITE_API_BASE_ENC=${VITE_API_BASE_ENC:+<set>}"
          npm run build

      - name: Check the built paths
        env:
          # Step-level env does not carry over between steps, so this has to be
          # passed again — without it BASE_PATH is empty here and the check below
          # fails every subpath deploy.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Guards the one mistake that deploys a silently broken site: asset URLs
          # that do not carry the base path 404 on Pages.
          #
          # configure-pages emits '/InputA' with no trailing slash, while
          # vite.config.ts normalises it to '/InputA/'. The guard has to apply the
          # same rule: without it the pattern becomes `src="/InputAassets/`, which
          # never matches, and the check fails every subpath deploy while the built
          # HTML is in fact correct.
          base="${BASE_PATH:-/}"
          [[ "$base" == */ ]] || base="$base/"

          grep -q "src=\"${base}assets/" dist/index.html || {
            echo "::error::dist/index.html does not reference ${base}assets/ — the base path is wrong"
            grep -oE '(href|src)="[^"]*"' dist/index.html
            exit 1
          }
          echo "asset URLs carry ${base} — correct."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
