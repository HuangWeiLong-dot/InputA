name: Feature request (简体中文)
description: 提议 InputA 的新功能或行为改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue 和 Pull Request，避免重复提议。

        > 请勿附上 LingQ token、密码、真实账号凭据、AI API key、keystore.properties、keystore 或签名 APK/AAB。
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: 说明当前遇到的问题、使用场景，以及该功能会带来什么价值。
      placeholder: 我在阅读 ... 时，需要 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: 描述期望的界面、交互或行为。大规模功能或重构请先创建 Issue 或 Discussion 与维护者确认方向。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: 说明考虑过的其他方案、变通方法，以及为什么当前方案更合适；没有可留空。
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Affected areas
      description: 列出可能涉及的模块或页面，例如 reader、explore、vocabulary、settings、data、design、android。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 用可验证的条件描述完成标准；例如“在英文和中文界面下均可 ...”。
    validations:
      required: false
  - type: dropdown
    id: sensitive-scope
    attributes:
      label: Sensitive scope
      description: 是否涉及架构、持久化、认证、网络服务商、发布版本或公开行为？这些变更需要先讨论。
      options:
        - No
        - Yes
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: 我已搜索现有 Issue 和 Pull Request，没有发现相同提议。
          required: true
        - label: 我了解该提议需要维护者确认范围和优先级，提交 Issue 不代表承诺实现。
          required: true
