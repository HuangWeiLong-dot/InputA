# Robolectric 模拟的 Android API 级别。
#
# 不写这一行的话，Robolectric 会采用清单里的 targetSdk（37），而它模拟 SDK 36/37
# 要求运行在 **Java 21** 上 —— 本机的 Gradle 跑在 Java 17，于是**所有** Robolectric
# 测试会在创建沙箱阶段就失败（UnsupportedOperationException: Android SDK 37
# requires Java 21），一条断言都跑不到。
#
# 固定在 34 的理由：被测的是 Room / Retrofit / DataStore 的**逻辑**，不依赖 API 37
# 的行为；固定值让结果可复现，沙箱启动也更快。真机上的 SDK 差异由步骤 10 的设备验收覆盖。
#
# 注意它挡不住的一类问题：Robolectric 用的是宿主上真实的 SQLite，而真机上的 SQLite
# 版本随 API 级别变化（minSdk 26 对应 3.18，不支持 UPSERT 语法）。所以「老设备上
# 才炸的 SQL」这类问题任何 Robolectric 测试都发现不了 —— 只能靠写代码时避开新语法。
sdk=34
