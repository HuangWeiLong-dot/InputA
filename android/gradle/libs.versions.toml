[versions]
# 版本都对着 Google Maven / Maven Central 的 maven-metadata.xml 核过存在性。
# AGP / Gradle / compileSdk / Compose BOM 四个是配套的，改一个先看这张注释。
#
# compileSdk = 37（本机装的是 platforms/android-37.2）：core-ktx 1.19.x、okhttp-android 5.5
# 这些当前稳定版都硬性要求编译目标 >= 37，AGP 会直接拒绝构建。Compose 1.12 起同样要求
# compileSdk 37 —— 所以 BOM 用最新的 2026.09.00 而不是更旧的版本。
agp = "9.4.1"
# 必须等于 AGP 9.4.1 内置的 Kotlin —— 从 gradle-9.4.1.pom 的 kotlin-gradle-plugin
# 依赖项读出来的 2.2.10。AGP 9 起自带 Kotlin，不再应用 org.jetbrains.kotlin.android；
# Compose 编译器插件是 Kotlin 编译器插件，版本必须与编译器严格一致，所以这两个数字
# 是绑死的。升级 AGP 时先读一遍它的 POM 再改这里。
kotlin = "2.2.10"
# KSP 已与 Kotlin 版本解耦（不再是 <kotlin>-<ksp> 形式）。AGP 9 的内置 Kotlin 不兼容
# kapt，Room / Hilt 的注解处理只能走 KSP，且要求 >= 2.3.4。
ksp = "2.3.12"
hilt = "2.60.1"
room = "2.8.5"
hiltNavigationCompose = "1.4.0"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
datastore = "1.2.1"
retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
turbine = "1.2.1"
junit = "4.13.2"
# Room 的内存库需要 Android Context，而本工程的测试跑在 JVM 上（没有仪器测试、
# 也没有连着的设备），所以数据层测试靠 Robolectric 提供框架实现。
# 4.17 的 android-all jar 覆盖到 API 37，与 compileSdk 对得上。
robolectric = "4.17"
androidxTestCore = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose —— 版本由 BOM 统一管理，下面都不写版本号
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 刻意没有 kotlin-android：AGP 9 起内置 Kotlin，应用它会直接构建失败
# （"The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin support
# since AGP 9.0"）。:domain 是纯 JVM 模块、不走 AGP，所以仍然需要 kotlin-jvm。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
