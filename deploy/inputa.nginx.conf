# InputA 后端（server/）的反代。
#
# 这个文件只匹配 inputa.duckdns.org 这一个 server_name，所以同一台 nginx 上的其它
# 站点完全不受影响 —— 增删改这个文件都不会碰到它们。
#
# 下面只有 80：证书由 `certbot --nginx -d inputa.duckdns.org` 负责，它跑完后会自动
# 往这个文件里补上 `listen 443 ssl` 与 ssl_certificate 几行（并留下
# "managed by Certbot" 标记），跟这台机器上原有的 API 站点是同一套流程。
#
# 所以：**不要在 certbot 跑过之后再覆盖这个文件**，那会把 443 和证书配置抹掉。
# deploy/setup-tls.sh 已经为此做了判断（检测到 managed by Certbot 就跳过重写）。

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_YOUR_DUCKDNS_HOST;

    # 后端自己的请求体上限是 1MB（server/index.js 的 MAX_BODY_BYTES），这里留出
    # 余量，让超限时是后端那条 JSON 错误先说话，而不是 nginx 的 413。
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 调用最长要等上游 60s（server/upstreams.js 的 AI 超时），默认 60s 会
        # 在边界上把它掐掉，留点余量。
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Gutenberg 的正文是最大 12MB 的纯文本，而后端（Node）自己不压缩，所以在这里压。
    # 只列文本类型：/api/tts 返回的是 mp3，列进去不但没用还白费 CPU。
    # text/html 是 nginx 永远会压的，不用列。
    #
    # gzip_proxied any 必须写：默认情况下 nginx 不压缩来自上游的响应。
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain application/json;
}
